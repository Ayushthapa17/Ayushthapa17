name: Generate Profile Metrics

on:
  schedule:
    - cron: "0 0 * * *"   # regenerates daily at midnight UTC
  workflow_dispatch:        # lets you trigger it manually from the Actions tab

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: github-metrics.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Ayushthapa17
          template: classic

          # Join date (shown via the "diff" section, e.g. "Member for X years")
          base: header, diff

          # Most used languages
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_analysis_timeout: 15

          # Contribution calendar (full year heatmap)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Commits per day / habits (busiest day of week, time of day)
          plugin_habits: yes
          plugin_habits_charts_type: bar
          plugin_habits_days: 30
          plugin_habits_facts: yes
          plugin_habits_from: 100
